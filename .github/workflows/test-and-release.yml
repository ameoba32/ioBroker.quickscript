name: Test and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-**'
  pull_request: {}

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: '22.x'
          package-cache: 'false'
          install-command: 'npm install'
          lint: false

  adapter-tests:
    needs: [check-and-lint]
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          package-cache: 'false'
          install-command: 'npm install'
          test-command: 'npm run test:package'

  deploy:
    needs: [check-and-lint, adapter-tests]
    # Publish only on a version tag, e.g. after `npm run release patch`
    if: |
      !cancelled() &&
      needs.check-and-lint.result == 'success' &&
      needs.adapter-tests.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: '22.x'
          package-cache: 'false'
          install-command: 'npm install'
          # npm-token is empty on purpose: npm Trusted Publishing uses OIDC
          npm-token: ''
          github-token: ${{ secrets.GITHUB_TOKEN }}
