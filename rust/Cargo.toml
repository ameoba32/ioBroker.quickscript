[package]
name = "quickscript-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
rquickjs = { version = "0.8", features = ["bindgen", "loader", "macro", "array-buffer"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
ureq = { version = "2.10", features = ["json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
